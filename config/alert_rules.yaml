alerts:
  - name: user_latency_p95_high
    severity: critical
    condition: 'latency_p95_ms > 3000'
    duration: 10m
    type: symptom-based
    channel: '#llmops-alerts'
    owner: api-oncall
    runbook: docs/alerts.md#alert-1
  - name: request_error_rate_high
    severity: critical
    condition: 'error_rate_pct > 2'
    duration: 5m
    type: symptom-based
    channel: '#llmops-alerts'
    owner: platform-oncall
    runbook: docs/alerts.md#alert-2
  - name: retrieval_success_degraded
    severity: warning
    condition: 'retrieval_success_rate_pct < 90'
    duration: 5m
    type: symptom-based
    channel: '#llmops-alerts'
    owner: retrieval-oncall
    runbook: docs/alerts.md#alert-3
